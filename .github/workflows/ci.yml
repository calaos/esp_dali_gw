name: ci

on:
  push:
    branches: ["**"]
    tags-ignore: ["v*"]
  pull_request:

permissions:
  contents: read
  packages: write

env:
  # Bump ESP-IDF or Node in .devcontainer/Dockerfile only; the tag follows its content hash so a
  # toolchain change invalidates the cache by construction.
  IMAGE_NAME: ghcr.io/calaos/esp_dali_gw-toolchain

jobs:
  toolchain:
    runs-on: ubuntu-latest
    outputs:
      image: ${{ steps.meta.outputs.image }}
    steps:
      - uses: actions/checkout@v4

      - id: meta
        run: |
          tag="${{ hashFiles('.devcontainer/Dockerfile') }}"
          echo "tag=$tag"            >> "$GITHUB_OUTPUT"
          echo "image=$IMAGE_NAME:$tag" >> "$GITHUB_OUTPUT"

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - id: probe
        run: |
          if docker manifest inspect "${{ steps.meta.outputs.image }}" >/dev/null 2>&1; then
            echo "exists=true" >> "$GITHUB_OUTPUT"
          else
            echo "exists=false" >> "$GITHUB_OUTPUT"
          fi

      - uses: docker/setup-buildx-action@v3
        if: steps.probe.outputs.exists == 'false'

      - uses: docker/build-push-action@v6
        if: steps.probe.outputs.exists == 'false'
        with:
          context: .
          file: .devcontainer/Dockerfile
          build-args: INSTALL_CLAUDE_CODE=0
          push: true
          tags: ${{ steps.meta.outputs.image }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  web:
    needs: toolchain
    runs-on: ubuntu-latest
    container:
      image: ${{ needs.toolchain.outputs.image }}
      # The runner's workspace is owned by a uid that does not exist in the image.
      options: --user root
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4
      - run: npm --prefix web ci
      - run: npm --prefix web run lint
      - run: npm --prefix web run typecheck
      - run: npm --prefix web run build
      - name: Bundle size budget
        run: tools/check-bundle-size.sh
      - uses: actions/upload-artifact@v4
        with:
          name: web-dist
          path: web/dist
          retention-days: 7

  firmware:
    needs: [toolchain, web]
    runs-on: ubuntu-latest
    container:
      image: ${{ needs.toolchain.outputs.image }}
      options: --user root
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0 # PROJECT_VER comes from `git describe`

      - uses: actions/download-artifact@v4
        with:
          name: web-dist
          path: web/dist

      - uses: actions/cache@v4
        with:
          path: .ccache
          key: ccache-${{ runner.os }}-${{ github.sha }}
          restore-keys: ccache-${{ runner.os }}-

      - name: Build
        env:
          CCACHE_DIR: ${{ github.workspace }}/.ccache
        run: |
          idf.py set-target esp32c6
          idf.py build

      - name: Size report and OTA slot budget
        run: tools/check-app-size.sh

      - name: Merged image
        run: |
          cd build
          esptool --chip esp32c6 merge-bin -o esp_dali_gw-merged.bin @flash_args

      - uses: actions/upload-artifact@v4
        with:
          name: firmware
          path: |
            build/esp_dali_gw.bin
            build/bootloader/bootloader.bin
            build/partition_table/partition-table.bin
            build/ota_data_initial.bin
            build/esp_dali_gw-merged.bin
          retention-days: 7

  host-tests:
    needs: toolchain
    runs-on: ubuntu-latest
    container:
      image: ${{ needs.toolchain.outputs.image }}
      options: --user root
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4
      - run: tools/host-tests.sh

  lint:
    needs: toolchain
    runs-on: ubuntu-latest
    container:
      image: ${{ needs.toolchain.outputs.image }}
      options: --user root
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4
      - name: clang-format
        run: |
          mapfile -t files < <(git ls-files '*.c' '*.h')
          printf '%s\n' "${files[@]}"
          clang-format --dry-run --Werror "${files[@]}"
      - name: cppcheck
        # Blocking: SPEC 15.2 step 4 says non-blocking at first, blocking once clean. It is clean.
        run: |
          cppcheck --enable=warning,portability --inline-suppr --std=c17 \
                   --suppress=missingInclude --error-exitcode=1 \
                   -I components/*/include components main
