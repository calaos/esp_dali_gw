name: ci

on:
  push:
    branches: ["**"]
    tags-ignore: ["v*"]
  pull_request:

permissions:
  contents: read
  packages: write

env:
  # Bump ESP-IDF or Node in .devcontainer/Dockerfile only; the tag follows its content hash so a
  # toolchain change invalidates the cache by construction.
  IMAGE_NAME: ghcr.io/calaos/esp_dali_gw-toolchain

jobs:
  toolchain:
    runs-on: ubuntu-latest
    outputs:
      image: ${{ steps.meta.outputs.image }}
    steps:
      - uses: actions/checkout@v4

      - id: meta
        run: |
          tag="${{ hashFiles('.devcontainer/Dockerfile') }}"
          echo "tag=$tag"            >> "$GITHUB_OUTPUT"
          echo "image=$IMAGE_NAME:$tag" >> "$GITHUB_OUTPUT"

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - id: probe
        run: |
          if docker manifest inspect "${{ steps.meta.outputs.image }}" >/dev/null 2>&1; then
            echo "exists=true" >> "$GITHUB_OUTPUT"
          else
            echo "exists=false" >> "$GITHUB_OUTPUT"
          fi

      - uses: docker/setup-buildx-action@v3
        if: steps.probe.outputs.exists == 'false'

      - uses: docker/build-push-action@v6
        if: steps.probe.outputs.exists == 'false'
        with:
          context: .
          file: .devcontainer/Dockerfile
          build-args: INSTALL_CLAUDE_CODE=0
          push: true
          tags: ${{ steps.meta.outputs.image }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  web:
    needs: toolchain
    runs-on: ubuntu-latest
    container:
      image: ${{ needs.toolchain.outputs.image }}
      # The runner's workspace is owned by a uid that does not exist in the image.
      options: --user root
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4
      - run: npm --prefix web ci
      - run: npm --prefix web run lint
      - run: npm --prefix web run typecheck
      - run: npm --prefix web run build
      - name: Bundle size budget
        run: tools/check-bundle-size.sh
      - uses: actions/upload-artifact@v4
        with:
          name: web-dist
          path: web/dist
          retention-days: 7

  # One leg per board. The toolchain image no longer pins IDF_TARGET, so each leg sets its own —
  # and gets its own build directory and its own sdkconfig, because both default to a single shared
  # path and the two targets would otherwise reconfigure each other's tree.
  firmware:
    needs: [toolchain, web]
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        target: [esp32c6, esp32s3]
    container:
      image: ${{ needs.toolchain.outputs.image }}
      options: --user root
    defaults:
      run:
        shell: bash
    env:
      BUILD_DIR: build-${{ matrix.target }}
      SDKCONFIG: sdkconfig.${{ matrix.target }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0 # PROJECT_VER comes from `git describe`

      - uses: actions/download-artifact@v4
        with:
          name: web-dist
          path: web/dist

      - uses: actions/cache@v4
        with:
          path: .ccache
          # Per target: the object files are for different architectures, and two legs sharing one
          # key would also race to save it.
          key: ccache-${{ runner.os }}-${{ matrix.target }}-${{ github.sha }}
          restore-keys: ccache-${{ runner.os }}-${{ matrix.target }}-

      - name: Build
        env:
          CCACHE_DIR: ${{ github.workspace }}/.ccache
        run: |
          idf.py -B "$BUILD_DIR" -D SDKCONFIG="$SDKCONFIG" set-target "${{ matrix.target }}"
          idf.py -B "$BUILD_DIR" -D SDKCONFIG="$SDKCONFIG" build

      - name: Size report and OTA slot budget
        # Reads the slot size from the partition table this build used; the C6 and the S3 do not
        # share one.
        run: tools/check-app-size.sh "$BUILD_DIR"

      - name: Merged image
        run: |
          cd "$BUILD_DIR"
          esptool --chip "${{ matrix.target }}" merge-bin \
            -o "esp_dali_gw-merged-${{ matrix.target }}.bin" @flash_args

      - uses: actions/upload-artifact@v4
        with:
          name: firmware-${{ matrix.target }}
          path: |
            build-${{ matrix.target }}/esp_dali_gw.bin
            build-${{ matrix.target }}/bootloader/bootloader.bin
            build-${{ matrix.target }}/partition_table/partition-table.bin
            build-${{ matrix.target }}/ota_data_initial.bin
            build-${{ matrix.target }}/esp_dali_gw-merged-${{ matrix.target }}.bin
          retention-days: 7

  host-tests:
    needs: toolchain
    runs-on: ubuntu-latest
    container:
      image: ${{ needs.toolchain.outputs.image }}
      options: --user root
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4
      - run: tools/host-tests.sh

  lint:
    needs: toolchain
    runs-on: ubuntu-latest
    container:
      image: ${{ needs.toolchain.outputs.image }}
      options: --user root
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4
      - name: clang-format
        run: |
          mapfile -t files < <(git ls-files '*.c' '*.h')
          printf '%s\n' "${files[@]}"
          clang-format --dry-run --Werror "${files[@]}"
      - name: cppcheck
        # Blocking: SPEC 15.2 step 4 says non-blocking at first, blocking once clean. It is clean.
        run: |
          cppcheck --enable=warning,portability --inline-suppr --std=c17 \
                   --suppress=missingInclude --error-exitcode=1 \
                   -I components/*/include components main
